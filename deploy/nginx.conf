# Replace railwise.example.com and install a valid TLS certificate before use.
server {
    listen 80;
    server_name railwise.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name railwise.example.com;
    ssl_certificate /etc/letsencrypt/live/railwise.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/railwise.example.com/privkey.pem;
    root /srv/railwise/frontend/dist;
    client_max_body_size 1m;
    location /static/ { alias /srv/railwise/backend/staticfiles/; }
    location ~ ^/(api|admin)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
