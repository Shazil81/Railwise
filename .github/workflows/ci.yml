name: Regression checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: irctc
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: irctc
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U irctc -d irctc"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: irctc
      DB_USER: irctc
      DB_PASSWORD: ci-only
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python backend/manage.py check
      - run: python backend/manage.py test bookings --settings=railway_core.test_settings --noinput
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run lint --prefix frontend
      - run: npm run build --prefix frontend
