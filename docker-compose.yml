services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: irctc
      POSTGRES_USER: irctc
      POSTGRES_PASSWORD: local-dev-only
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["railwise_pg:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U irctc -d irctc"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7
    ports: ["127.0.0.1:6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["railwise_redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  railwise_pg:
  railwise_redis:
